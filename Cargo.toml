[workspace]
resolver = "3"
members = [
  "services/auth_backend/",
  "services/gradegetter/gradegetter",
  "services/gradegetter/gradegetter_backend/",
  "services/notification_backend/",
  "services/nanopass_backend/",
  "services/smalltalk_backend",
  "services/backend-common",
  "services/service_connector",
  "crates/crypto_utils",
  "crates/friendly-namer",
  "crates/dln-core",
  "apps/dln-cli",
  "apps/dln-ui",
]

[workspace.package]
authors = ["Devin Little <devinlittlee@gmail.com>"]
repository = "https://git.home.devinlittle.net/devin/devinlittle-net"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
tokio = {version = "1.53.1", features = ["full"]}
tokio-stream = "0.1.19"
axum = {version = "0.8.9", features = ["macros"]}
axum-extra = "0.12.6"
axum-server = {version = "0.8.0", features = ["tls-rustls"]}
axum-prometheus = "0.10.1"
hyper = "1.11.0"
hyper-tls = "0.6.0"
tower-http = { version = "0.7.0", features = ["cors"]}
tower = "0.5.3"
utoipa = {version = "5.5.0", features = ["axum_extras", "uuid", "chrono"]}
utoipa-scalar = {version = "0.3.0", features = ["axum"]}
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs"] }
rustls-webpki = { version = "0.103.13", default-features = false, features = ["aws-lc-rs"] }
aws-lc-rs = "1.17.3"
openssl = { version = "0.10.81", features = ["vendored"] }
curl = {version = "0.4.50", features = ["rustls"]}
reqwest = {version = "0.13.4", default-features = false, features = ["json", "rustls"]}
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
futures-util = "0.3.33"
serde = {version = "1.0.229", features = ["derive"]}
serde_json = {version = "1.0.151"}
serde_with = { version = "3.21.0", features = ["chrono_0_4"] }
sha2 = {version = "0.11.0"}
chrono = { version = "0.4.45", features = ["serde"] }
argon2 = "0.5.3"
sqlx = { version = "0.9.0", features = [
  "runtime-tokio",
  "tls-rustls-aws-lc-rs",
  "sqlx-toml",
  "postgres",
  "migrate",
  "json",
  "chrono",
  "uuid"]}
uuid = {version = "1.24.0", features = ["v4", "serde"]}
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
web-push = "0.11.0"
dashmap = "6.2.1"
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"
tracing-opentelemetry = "0.33.0"
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic", "trace"] }
anyhow = "1.0.104"
thiserror = "2.0.19"
dotenvy = "0.15.7"
constant_time_eq = "0.5.0"
regex = "1.13.1"
scraper = "0.27.0"
aes-gcm = "0.11"
aes = "0.9.2"
rand = "0.10.2"
base64 = "0.23.0"
crypto_utils = { path = "./crates/crypto_utils" }
backend-common = { path = "./services/backend-common/" }
strum = { version = "0.28.0", features = ["derive"] }
document-features = "0.2.12"

tonic = "0.14.6"
tonic-reflection = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
prost = "0.14.4"
webrtc = "0.20.0"

dln-core = { path = "./crates/dln-core" }

arc-swap = "1.9.2"
reqwest_cookie_store = "0.10.0"
cookie_store = "0.22.1"
directories = "6.0.0"
toml = "1.1.4"
url = "2.5.8"
os_info = "3.15.0"

clap = "4.6.5"
clap_derive = "4.6.4"
clap_complete = "4.6.8"
indicatif = "0.18.6"
inquire = "0.9.4"
owo-colors = "4.3.0"
comfy-table = "7.2.2"

ratatui = "0.30.2"

cxx = "1.0.198"
cxx-qt = "0.9.1"
cxx-qt-lib = { version="0.9.1", features = ["full"] }
cxx-qt-lib-extras = "0.9.1"
cxx-qt-build = { version = "0.9.1", features = [ "link_qt_object_files" ] }


[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true
debug = false
debug-assertions = false
overflow-checks = false
